spring:
  application:
    name: civicsolve
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicsolve_ai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your_super_secret_jwt_key_minimum_32_characters_long_for_security}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  api-key: ${AI_API_KEY:}
  provider: ${AI_PROVIDER:openai}
  model: ${AI_MODEL:gpt-4-turbo}
  enabled: ${AI_ENABLED:true}

logging:
  level:
    root: INFO
    com.civicsolve: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
