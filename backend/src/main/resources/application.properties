spring.application.name=civicsolve-ai

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/civicsolve_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=your-secret-key-min-32-characters-long-for-security-purposes
jwt.expiration-ms=86400000

# AI Configuration
ai.enabled=true
ai.provider=openai
ai.model=gpt-4
ai.api-key=${AI_API_KEY:your-api-key-here}

# Logging Configuration
logging.level.root=INFO
logging.level.com.civicsolve=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Application Configuration
app.name=CiviSolve AI
app.version=1.0.0
app.description=Civic Issue Resolution Platform
